<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFBEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FEF3C7;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#D97706"/>
    </marker>
    <marker id="arrowBrown" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#92400E"/>
    </marker>
  </defs>
  <rect width="800" height="600" fill="url(#grad4)"/>

  <!-- Title -->
  <text x="400" y="60" font-family="PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#92400E" text-anchor="middle">医学智能 Reasoning RAG 流程</text>

  <!-- Step 1: Input -->
  <g transform="translate(50, 100)">
    <rect width="180" height="80" rx="10" fill="white" stroke="#F59E0B" stroke-width="2"/>
    <text x="90" y="35" font-family="PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#92400E" text-anchor="middle">临床问题输入</text>
    <text x="90" y="60" font-family="PingFang SC, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">"该患者症状是否符合..."</text>
  </g>

  <!-- Arrow -->
  <path d="M230 140 L280 140" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrowAmber)"/>

  <!-- Step 2: Reasoning Loop -->
  <g transform="translate(300, 100)">
    <rect width="450" height="360" rx="15" fill="white" stroke="#D97706" stroke-width="2.5" stroke-dasharray="8,4" fill-opacity="0.6"/>
    <text x="225" y="30" font-family="PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#92400E" text-anchor="middle">Agentic 医学推理引擎</text>

    <!-- Reasoning Step -->
    <g transform="translate(30, 60)">
      <rect width="180" height="120" rx="10" fill="#FEF3C7" filter="drop-shadow(0 4px 12px rgba(217, 119, 6, 0.1))"/>
      <text x="90" y="35" font-family="PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#92400E" text-anchor="middle">① 推理与规划</text>
      <text x="20" y="65" font-family="PingFang SC, sans-serif" font-size="12" fill="#78350F">Thought: 需要查阅肺癌</text>
      <text x="20" y="85" font-family="PingFang SC, sans-serif" font-size="12" fill="#78350F">最新的 TNM 分期标准...</text>
    </g>

    <!-- Arrow -->
    <path d="M210 120 L240 120" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>

    <!-- Tool Call Step -->
    <g transform="translate(240, 60)">
      <rect width="180" height="180" rx="10" fill="#FDF6E3" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="90" y="30" font-family="PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#92400E" text-anchor="middle">② 医学工具调用</text>

      <!-- Tool List -->
      <g transform="translate(15, 50)">
        <rect width="150" height="25" rx="4" fill="white" stroke="#F59E0B" stroke-width="1"/>
        <text x="75" y="17" font-family="PingFang SC, sans-serif" font-size="11" fill="#78350F" text-anchor="middle">🔍 医学文献检索</text>
      </g>
      <g transform="translate(15, 85)">
        <rect width="150" height="25" rx="4" fill="white" stroke="#F59E0B" stroke-width="1"/>
        <text x="75" y="17" font-family="PingFang SC, sans-serif" font-size="11" fill="#78350F" text-anchor="middle">📊 临床指南查询</text>
      </g>
      <g transform="translate(15, 120)">
        <rect width="150" height="25" rx="4" fill="white" stroke="#F59E0B" stroke-width="1"/>
        <text x="75" y="17" font-family="PingFang SC, sans-serif" font-size="11" fill="#78350F" text-anchor="middle">🧬 知识图谱关联</text>
      </g>
    </g>

    <!-- Loop Back -->
    <path d="M330 240 Q 330 300 120 180" stroke="#92400E" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowBrown)"/>
    <text x="225" y="300" font-family="PingFang SC, sans-serif" font-size="12" fill="#92400E" text-anchor="middle">观察反馈与动态修正</text>
  </g>

  <!-- Result -->
  <g transform="translate(300, 500)">
    <rect width="450" height="70" rx="12" fill="#F59E0B" filter="drop-shadow(0 4px 15px rgba(245, 158, 11, 0.3))"/>
    <text x="225" y="40" font-family="PingFang SC, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">③ 生成循证医学建议</text>
  </g>

  <!-- Annotation -->
  <g transform="translate(50, 300)">
    <text x="0" y="0" font-family="PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#92400E">系统特点：</text>
    <text x="0" y="25" font-family="PingFang SC, sans-serif" font-size="12" fill="#6B7280">• 临床逻辑推理</text>
    <text x="0" y="45" font-family="PingFang SC, sans-serif" font-size="12" fill="#6B7280">• 多源证据融合</text>
    <text x="0" y="65" font-family="PingFang SC, sans-serif" font-size="12" fill="#6B7280">• 结论可溯源性</text>
  </g>
</svg>
