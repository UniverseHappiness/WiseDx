<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFBEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FEF3C7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#grad2)"/>

  <!-- Decorative circles -->
  <circle cx="120" cy="90" r="110" fill="#D97706" opacity="0.04"/>
  <circle cx="680" cy="510" r="130" fill="#D97706" opacity="0.04"/>

  <!-- Title -->
  <text x="400" y="70" font-family="PingFang SC, sans-serif" font-size="36" font-weight="700" fill="#92400E" text-anchor="middle">医学混合检索策略</text>
  <text x="400" y="105" font-family="PingFang SC, sans-serif" font-size="16" fill="#B45309" text-anchor="middle">术语精准匹配 + 临床语义理解 + 医学知识图谱</text>

  <!-- Three retrieval methods -->
  <!-- Term Matching (BM25) -->
  <g transform="translate(80, 170)">
    <rect width="180" height="280" rx="12" fill="white" stroke="#F59E0B" stroke-width="2.5" filter="drop-shadow(0 4px 16px rgba(245, 158, 11, 0.15))"/>
    <rect width="180" height="50" rx="12" fill="#FEF3C7"/>
    <text x="90" y="33" font-family="PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#92400E" text-anchor="middle">医学术语匹配</text>

    <!-- Icon -->
    <g transform="translate(65, 70)">
      <circle cx="25" cy="25" r="20" fill="#FBBF24" opacity="0.2"/>
      <text x="25" y="33" font-family="Arial" font-size="24" font-weight="700" fill="#F59E0B" text-anchor="middle">T</text>
    </g>

    <!-- Features -->
    <text x="90" y="135" font-family="PingFang SC, sans-serif" font-size="14" fill="#92400E" text-anchor="middle">精准关键词检索</text>

    <g transform="translate(20, 155)">
      <rect x="0" y="0" width="140" height="30" rx="6" fill="#FEF3C7"/>
      <text x="70" y="20" font-family="PingFang SC, sans-serif" font-size="12" fill="#78350F" text-anchor="middle">MeSH 词表支持</text>
    </g>

    <g transform="translate(20, 195)">
      <rect x="0" y="0" width="140" height="30" rx="6" fill="#FEF3C7"/>
      <text x="70" y="20" font-family="PingFang SC, sans-serif" font-size="12" fill="#78350F" text-anchor="middle">药品名称识别</text>
    </g>

    <g transform="translate(20, 235)">
      <rect x="0" y="0" width="140" height="30" rx="6" fill="#FEF3C7"/>
      <text x="70" y="20" font-family="PingFang SC, sans-serif" font-size="12" fill="#78350F" text-anchor="middle">ICD-10 编码映射</text>
    </g>
  </g>

  <!-- Vector -->
  <g transform="translate(310, 170)">
    <rect width="180" height="280" rx="12" fill="white" stroke="#F59E0B" stroke-width="2.5" filter="drop-shadow(0 4px 16px rgba(245, 158, 11, 0.15))"/>
    <rect width="180" height="50" rx="12" fill="#FEF3C7"/>
    <text x="90" y="33" font-family="PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#92400E" text-anchor="middle">临床语义检索</text>

    <!-- Icon -->
    <g transform="translate(65, 70)">
      <circle cx="25" cy="25" r="20" fill="#FBBF24" opacity="0.2"/>
      <text x="25" y="33" font-family="Arial" font-size="24" font-weight="700" fill="#F59E0B" text-anchor="middle">V</text>
    </g>

    <!-- Features -->
    <text x="90" y="135" font-family="PingFang SC, sans-serif" font-size="14" fill="#92400E" text-anchor="middle">深度语义理解</text>

    <g transform="translate(20, 155)">
      <rect x="0" y="0" width="140" height="30" rx="6" fill="#FEF3C7"/>
      <text x="70" y="20" font-family="PingFang SC, sans-serif" font-size="12" fill="#78350F" text-anchor="middle">临床笔记分析</text>
    </g>

    <g transform="translate(20, 195)">
      <rect x="0" y="0" width="140" height="30" rx="6" fill="#FEF3C7"/>
      <text x="70" y="20" font-family="PingFang SC, sans-serif" font-size="12" fill="#78350F" text-anchor="middle">症状关联理解</text>
    </g>

    <g transform="translate(20, 235)">
      <rect x="0" y="0" width="140" height="30" rx="6" fill="#FEF3C7"/>
      <text x="70" y="20" font-family="PingFang SC, sans-serif" font-size="12" fill="#78350F" text-anchor="middle">上下文推理</text>
    </g>
  </g>

  <!-- Knowledge Graph -->
  <g transform="translate(540, 170)">
    <rect width="180" height="280" rx="12" fill="white" stroke="#F59E0B" stroke-width="2.5" filter="drop-shadow(0 4px 16px rgba(245, 158, 11, 0.15))"/>
    <rect width="180" height="50" rx="12" fill="#FEF3C7"/>
    <text x="90" y="33" font-family="PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#92400E" text-anchor="middle">医学知识图谱</text>

    <!-- Icon -->
    <g transform="translate(65, 70)">
      <circle cx="25" cy="25" r="20" fill="#FBBF24" opacity="0.2"/>
      <text x="25" y="33" font-family="Arial" font-size="24" font-weight="700" fill="#F59E0B" text-anchor="middle">G</text>
    </g>

    <!-- Features -->
    <text x="90" y="135" font-family="PingFang SC, sans-serif" font-size="14" fill="#92400E" text-anchor="middle">实体关系召回</text>

    <g transform="translate(20, 155)">
      <rect x="0" y="0" width="140" height="30" rx="6" fill="#FEF3C7"/>
      <text x="70" y="20" font-family="PingFang SC, sans-serif" font-size="12" fill="#78350F" text-anchor="middle">疾病-症状关系</text>
    </g>

    <g transform="translate(20, 195)">
      <rect x="0" y="0" width="140" height="30" rx="6" fill="#FEF3C7"/>
      <text x="70" y="20" font-family="PingFang SC, sans-serif" font-size="12" fill="#78350F" text-anchor="middle">药物相互作用</text>
    </g>

    <g transform="translate(20, 235)">
      <rect x="0" y="0" width="140" height="30" rx="6" fill="#FEF3C7"/>
      <text x="70" y="20" font-family="PingFang SC, sans-serif" font-size="12" fill="#78350F" text-anchor="middle">解剖结构映射</text>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M260 310 L310 310 M490 310 L540 310" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Final Rerank -->
  <g transform="translate(250, 480)">
    <rect width="300" height="60" rx="15" fill="#F59E0B" filter="drop-shadow(0 4px 20px rgba(245, 158, 11, 0.2))"/>
    <text x="150" y="38" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">医学临床重排序 (Rerank)</text>
  </g>
</svg>
